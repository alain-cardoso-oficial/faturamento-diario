# Configuração de Proxy Reverso Nginx para bi-vendas.oficialwebshop.com.br
# Localização recomendada na VPS: /etc/nginx/sites-available/bi-vendas.oficialwebshop.com.br

server {
    listen 80;
    listen [::]:80;
    server_name bi-vendas.oficialwebshop.com.br;

    # Logs de acesso e erro específicos do domínio
    access_log /var/log/nginx/bi-vendas.access.log;
    error_log /var/log/nginx/bi-vendas.error.log;

    # Otimizações de compressão
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # Headers de encaminhamento
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts estendidos para processamento de snapshots e chamadas à API Tiny
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        send_timeout 180s;

        # Desabilita buffer de proxy para respostas em tempo real se necessário
        proxy_buffering off;
    }
}

